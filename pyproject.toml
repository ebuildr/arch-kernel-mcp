[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-kernel-mcp"
version = "0.1.0"
description = "MCP server for managing Arch Linux kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
]

[project.scripts]
arch-kernel-mcp = "arch_kernel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_kernel_mcp"]
